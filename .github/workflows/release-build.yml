name: Release Windows and macOS ARM

on:
  push:
    tags: ['[0-9]*', 'v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (manual runs only build artifacts; push a tag to publish)'
        default: '3.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          python3 - <<'VERSION_PY'
          import os, re
          value = os.environ['RELEASE_TAG'].removeprefix('v')
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-(alpha|beta|rc)(\.\d+)?)?', value):
              raise SystemExit('Use a semantic version, such as 3.0.0 or v3.0.0-rc.1')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={value}\n')
          VERSION_PY

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            triplet: x64-windows-release
          - os: macos-14
            platform: macos-arm64
            triplet: arm64-osx-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-cache
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_REVISION: 5dd2e1600d049b498ff9fb9fe15997533ae0c804
      # Legacy dependency CMakeLists require policies removed by CMake 4.
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: resources/panel/package-lock.json
      - name: Build settings panel
        working-directory: resources/panel
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build
      - name: Check out pinned vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REVISION }}
          path: build/vcpkg
          fetch-depth: 0
          persist-credentials: false
      - name: Restore C++ binary cache
        id: cpp-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/vcpkg-cache
          key: vcpkg-${{ matrix.os }}-${{ matrix.triplet }}-${{ env.VCPKG_REVISION }}-${{ hashFiles('vcpkg.json', 'build-scripts/triplets/*') }}
          restore-keys: vcpkg-${{ matrix.os }}-${{ matrix.triplet }}-
      - name: Create binary cache directory
        shell: bash
        run: mkdir -p build/vcpkg-cache
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & build/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release "-DJVERSION=$env:RELEASE_VERSION" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/build/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/build/vcpkg_installed" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            "-DVCPKG_OVERLAY_TRIPLETS=$env:GITHUB_WORKSPACE/build-scripts/triplets" `
            -DJPET_BUILD_UPDATE_TESTS=ON -DFAIL_ON_WARNINGS=OFF -DPORTABLE=1
      - name: Configure macOS ARM
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          build/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DJVERSION="$RELEASE_VERSION" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/build/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/build/vcpkg_installed" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx-release \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/build-scripts/triplets" \
            -DJPET_BUILD_UPDATE_TESTS=ON
      - name: Build and test
        run: |
          cmake --build build/release --config Release --parallel 3
          ctest --test-dir build/release -C Release --output-on-failure
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, build/package/JPet | Out-Null
          Copy-Item build/release/bin/JPet/Release/* build/package/JPet -Recurse -Force
          Get-ChildItem build/package/JPet -Filter *.pdb | Remove-Item
          Get-ChildItem build/package/JPet -Filter update_release_test.exe | Remove-Item
          Copy-Item build/vcpkg_installed/x64-windows-release/bin/*.dll build/package/JPet -Force
          Copy-Item dll/* build/package/JPet -Force
          Copy-Item "$env:WINDIR/System32/msvcp140*.dll" build/package/JPet -Force
          Copy-Item "$env:WINDIR/System32/vcruntime140*.dll" build/package/JPet -Force
          Compress-Archive -Path build/package/JPet -DestinationPath "dist/jpet-$env:RELEASE_VERSION-windows-x64.zip"
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DMyAppVersion=$env:RELEASE_VERSION" build-scripts/jpet_setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build-scripts/Output/JPetSetup.exe "dist/jpet-$env:RELEASE_VERSION-windows-x64-setup.exe"
      - name: Test Windows update helper
        if: runner.os == 'Windows'
        run: python tests/windows_update_helper_test.py
      - name: Verify and package macOS ARM
        if: runner.os == 'macOS'
        run: |
          python3 build-scripts/package_macos.py build/release/bin/JPet/JPet.app "dist/jpet-$RELEASE_VERSION-macos-arm64.zip"
          python3 tests/update_helper_test.py
      - name: Add checksums
        shell: bash
        run: |
          python3 - <<'CHECKSUM_PY'
          import hashlib, pathlib
          for file in pathlib.Path('dist').iterdir():
              if file.suffix not in ('.zip', '.exe'): continue
              with file.open('rb') as source:
                  digest = hashlib.file_digest(source, 'sha256').hexdigest()
              file.with_suffix(file.suffix + '.sha256').write_text(digest + '  ' + file.name + '\n')
          CHECKSUM_PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            build/vcpkg/buildtrees/**/*.log
            build/release/vcpkg-manifest-install.log
          if-no-files-found: ignore
      - name: Save built C++ dependencies
        if: always() && steps.cpp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/vcpkg-cache
          key: ${{ steps.cpp-cache.outputs.cache-primary-key }}

  release:
    if: github.event_name == 'push'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish complete Release
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          # Draft uploads prevent clients from seeing a partial release.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "JPet $RELEASE_VERSION" --generate-notes
          elif [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo 'This tag already has a published Release; create a new version tag.' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.exe dist/SHA256SUMS --clobber
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
