name: Lint and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: resources/panel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: resources/panel/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Check Svelte and JS types
        run: npm run check
      - name: Build
        run: npm run build

  game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev
      # Game rules and achievements only depend on nlohmann/json.
      - name: Test game rules
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/game_test.cpp src/GameRules.cpp -o game_test && ./game_test
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/achievements_test.cpp -o achievements_test && ./achievements_test

  login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Bilibili QR login
        run: g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/bilibili_login_test.cpp -o bilibili_login_test && ./bilibili_login_test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Errors only (syntax, undefined names, unused imports); the scripts keep a compact style.
      - name: Lint scripts
        run: pipx run ruff==0.14.0 check --select E9,F tests build-scripts
